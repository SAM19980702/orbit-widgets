name: Build IPA
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -o project.zip -d project
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: project
        run: xcodegen generate
      - name: Archive (unsigned)
        working-directory: project
        run: |
          xcodebuild -project OrbitWidget.xcodeproj -scheme OrbitWidget -sdk iphoneos -configuration Release archive -archivePath "$RUNNER_TEMP/app.xcarchive" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM=""
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R "$RUNNER_TEMP/app.xcarchive/Products/Applications/OrbitWidget.app" Payload/
          zip -r OrbitWidget-unsigned.ipa Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: OrbitWidget-IPA
          path: OrbitWidget-unsigned.ipa
